[project]
name = "home-network-agent"
version = "0.1.0"
requires-python = "==3.12.3"
dependencies = [
    "annotated-types==0.7.0",
    "anyio==4.12.1",
    "certifi==2026.1.4",
    "charset-normalizer==3.4.4",
    "colorama==0.4.6",
    "distro==1.9.0",
    "h11==0.16.0",
    "httpcore==1.0.9",
    "httpx==0.28.1",
    "idna==3.11",
    "jiter==0.12.0",
    "loguru==0.7.3",
    "openai==2.14.0",
    "pydantic==2.12.5",
    "pydantic-settings==2.12.0",
    "pydantic-core==2.41.5",
    "pyyaml==6.0.2",
    "python-dotenv==1.2.1",
    "requests==2.32.5",
    "sniffio==1.3.1",
    "tqdm==4.67.1",
    "typing-inspection==0.4.2",
    "typing-extensions==4.15.0",
    "urllib3==2.6.3",
]

[dependency-groups]
dev = ["ruff==0.14.11"]

[tool.uv]
package = false

[tool.ruff]
line-length = 160
target-version = "py312"

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = true
line-ending = "auto"

[tool.ruff.lint.isort]
lines-after-imports = 2
